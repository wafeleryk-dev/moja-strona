
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Witamy!</title>
  <style>
    body {
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    main {
      background: #202a3d;
      padding: 35px;
      border-radius: 18px;
      max-width: 400px;
      text-align: center;
    }
    button {
      background: #5865f2;
      color: white;
      border: 0;
      padding: 14px 24px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 16px;
    }
    #status { margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Witaj na stronie!</h1>
    <p>
      Aby kontynuować, możesz dobrowolnie wyrazić
      zgodę na przekazanie właścicielowi strony
      Twojego publicznego adresu IP.
      Adres zostanie wysłany na prywatny kanał Discord.
    </p>
    <button id="agree">Wyrażam zgodę i kontynuuję</button>
    <p id="status"></p>
  </main>

  <script>
    document.getElementById("agree").onclick = async () => {
      const button = document.getElementById("agree");
      const status = document.getElementById("status");

      button.disabled = true;
      status.textContent = "Przetwarzanie...";

      try {
        const response = await fetch("/consent", {
          method: "POST"
        });

        if (!response.ok) throw new Error();

        status.textContent = "Dziękujemy! Możesz kontynuować.";
      } catch {
        status.textContent = "Wystąpił błąd. Spróbuj ponownie.";
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
